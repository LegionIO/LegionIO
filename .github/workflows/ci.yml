name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  ci:
    uses: LegionIO/.github/.github/workflows/ci.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      needs-rabbitmq: true
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"8e73a9ef3c13958e3e1e7fc98532e41283159706"},"legion-data":{"repository":"LegionIO/legion-data","ref":"3901e64ad9fda7b81fe93869fcd8e753497d2d78"},"legion-transport":{"repository":"LegionIO/legion-transport","ref":"f5a60099d4b734913f2eb33e732339dada354a4f"},"legion-rbac":{"repository":"LegionIO/legion-rbac","ref":"abc3001b59f2a28f9b55d570fafc8906f2974d35"},"legion-mcp":{"repository":"LegionIO/legion-mcp","ref":"045fec99c5954738577bfd9e8bd7b326f9fac52f"},"legion-crypt":{"repository":"LegionIO/legion-crypt","ref":"9317bd69cbbcc0feeaaff8368bed3569ed98b101"},"lex-conditioner":{"repository":"LegionIO/lex-conditioner","ref":"0030cc80143adfb578debb4bd001e7dabe9a195b"},"lex-transformer":{"repository":"LegionIO/lex-transformer","ref":"45b6bb7e81242818bbd186357f7840c8461f15e3"},"lex-tasker":{"repository":"LegionIO/lex-tasker","ref":"3e7057d3537ac7f1cd36f0f6081d34528d768928"}}' || '{}' }}

  security:
    uses: LegionIO/.github/.github/workflows/security-scan.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      brakeman-enabled: false
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"8e73a9ef3c13958e3e1e7fc98532e41283159706"},"legion-data":{"repository":"LegionIO/legion-data","ref":"3901e64ad9fda7b81fe93869fcd8e753497d2d78"},"legion-transport":{"repository":"LegionIO/legion-transport","ref":"f5a60099d4b734913f2eb33e732339dada354a4f"},"legion-rbac":{"repository":"LegionIO/legion-rbac","ref":"abc3001b59f2a28f9b55d570fafc8906f2974d35"},"legion-mcp":{"repository":"LegionIO/legion-mcp","ref":"045fec99c5954738577bfd9e8bd7b326f9fac52f"},"legion-crypt":{"repository":"LegionIO/legion-crypt","ref":"9317bd69cbbcc0feeaaff8368bed3569ed98b101"},"lex-conditioner":{"repository":"LegionIO/lex-conditioner","ref":"0030cc80143adfb578debb4bd001e7dabe9a195b"},"lex-transformer":{"repository":"LegionIO/lex-transformer","ref":"45b6bb7e81242818bbd186357f7840c8461f15e3"},"lex-tasker":{"repository":"LegionIO/lex-tasker","ref":"3e7057d3537ac7f1cd36f0f6081d34528d768928"}}' || '{}' }}

  version-changelog:
    uses: LegionIO/.github/.github/workflows/version-changelog.yml@main

  dependency-review:
    uses: LegionIO/.github/.github/workflows/dependency-review.yml@main

  stale:
    if: github.event_name == 'schedule'
    uses: LegionIO/.github/.github/workflows/stale.yml@main

  release:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: LegionIO/.github/.github/workflows/release.yml@main
    secrets:
      rubygems-api-key: ${{ secrets.RUBYGEMS_API_KEY }}

  trigger-homebrew:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger unified Homebrew build
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DISPATCH_TOKEN }}
          LEGIONIO_VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh api repos/LegionIO/homebrew-tap/dispatches \
            -f event_type=build-legion \
            -f "client_payload[legionio_version]=$LEGIONIO_VERSION" \
            -f "client_payload[ruby_version]=3.4.8" \
            -f "client_payload[package_revision]=1"

  docker-build:
    name: Build Docker Image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/legionio/legion:${{ needs.release.outputs.version }}
            ghcr.io/legionio/legion:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
