name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  ci:
    uses: LegionIO/.github/.github/workflows/ci.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      needs-rabbitmq: true
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"ec2274f2001f0b8db296acf78ea99f2a8aebb4d7"},"legion-data":{"repository":"LegionIO/legion-data","ref":"1174f6fac06c53235e688f9bc35ee47c730f3651"},"legion-transport":{"repository":"LegionIO/legion-transport","ref":"0cec78271825be7ed9d8c7888ffcbb7cfd321d12"},"legion-rbac":{"repository":"LegionIO/legion-rbac","ref":"26e9982e131c968ba2f8681e3bdad23c16acfaf7"},"legion-mcp":{"repository":"LegionIO/legion-mcp","ref":"90af6ac41362a8f7dbf81b92786b5a9b4443f324"}}' || '{}' }}

  security:
    uses: LegionIO/.github/.github/workflows/security-scan.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      brakeman-enabled: false
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"ec2274f2001f0b8db296acf78ea99f2a8aebb4d7"},"legion-data":{"repository":"LegionIO/legion-data","ref":"1174f6fac06c53235e688f9bc35ee47c730f3651"},"legion-transport":{"repository":"LegionIO/legion-transport","ref":"0cec78271825be7ed9d8c7888ffcbb7cfd321d12"},"legion-rbac":{"repository":"LegionIO/legion-rbac","ref":"26e9982e131c968ba2f8681e3bdad23c16acfaf7"},"legion-mcp":{"repository":"LegionIO/legion-mcp","ref":"90af6ac41362a8f7dbf81b92786b5a9b4443f324"}}' || '{}' }}

  version-changelog:
    uses: LegionIO/.github/.github/workflows/version-changelog.yml@main

  dependency-review:
    uses: LegionIO/.github/.github/workflows/dependency-review.yml@main

  stale:
    if: github.event_name == 'schedule'
    uses: LegionIO/.github/.github/workflows/stale.yml@main

  release:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: LegionIO/.github/.github/workflows/release.yml@main
    secrets:
      rubygems-api-key: ${{ secrets.RUBYGEMS_API_KEY }}

  trigger-homebrew:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger unified Homebrew build
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DISPATCH_TOKEN }}
          LEGIONIO_VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh api repos/LegionIO/homebrew-tap/dispatches \
            -f event_type=build-legion \
            -f "client_payload[legionio_version]=$LEGIONIO_VERSION" \
            -f "client_payload[ruby_version]=3.4.8" \
            -f "client_payload[package_revision]=1"

  docker-build:
    name: Build Docker Image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/legionio/legion:${{ needs.release.outputs.version }}
            ghcr.io/legionio/legion:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
